query GetFilteredCategoryProducts($categorySlug: String!, $filters: ProductFiltersInput, $first: Int!, $page: Int!) {
    getFilteredCategoryProducts(categorySlug: $categorySlug, filters: $filters, first: $first, page: $page) {
        data {
            id
            name
            slug
            price {
                isDiscounted
                regularPrice {
                    amount
                    currency {
                        symbol
                    }
                }
                value {
                    amount
                    currency {
                        symbol
                    }
                }
            }
            primaryImage {
                url
            }
            averageRating
            customAttributes {
                label
                name
                value
                values
                type
            }
        }
        paginatorInfo {
            currentPage
            total
            lastPage
        }
    }
}

query GetCategoryProductFilters($categorySlug: String!) {
    getCategoryProductFilters(categorySlug: $categorySlug) {
        ...CategoryProductFilters
    }
}