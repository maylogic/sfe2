query GetFilteredCategoryProducts($categorySlug: String!, $filters: ProductFiltersInput, $first: Int!) {
    getFilteredCategoryProducts(categorySlug: $categorySlug, filters: $filters, first: $first) {
        edges {
            node {
                id
                name
                slug
                price {
                    isDiscounted
                    regularPrice {
                        amount
                        currency {
                            symbol
                        }
                    }
                    value {
                        amount
                        currency {
                            symbol
                        }
                    }
                }
                primaryImage {
                    url
                }
                averageRating
                customAttributes {
                    label
                    name
                    value
                    values
                    type
                }
            }
        }
    }
}

query GetCategoryProductFilters($categorySlug: String!) {
    getCategoryProductFilters(categorySlug: $categorySlug) {
        ...CategoryProductFilters
    }
}