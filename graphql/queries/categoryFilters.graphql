query GetFilteredCategoryProducts($categorySlug: String!, $filters: ProductFiltersInput) {
    filterCategoryProducts(categorySlug: $categorySlug, filters: $filters) {
        id
        name
        slug
        price {
            isDiscounted
            regularPrice {
                amount
                currency {
                    symbol
                }
            }
            value {
                amount
                currency {
                    symbol
                }
            }
        }
        primaryImage {
            url
        }
        averageRating
        customAttributes {
            label
            name
            value
            values
            type
        }
    }
}

query GetCategoryProductFilters($categorySlug: String!) {
    productFilters(categorySlug: $categorySlug) {
        priceRange {
            min
            max
        }
        ratingRange {
            min
            max
        }
        attributes {
            name
            label
            values
        }
    }
}