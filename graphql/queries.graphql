query CurrentAuthenticatedUser {
    me {
        activeCart {
            ...SidebarCart
        }
    }
}

query GetCategories {
    getCategories {
        ...CategoryFields
        subcategories {
            ...CategoryFields
            subcategories {
                ...CategoryFields
                subcategories {
                    ...CategoryFields
                    subcategories {
                        ...CategoryFields
                        subcategories {
                            ...CategoryFields
                            subcategories {
                                ...CategoryFields
                                subcategories {
                                    ...CategoryFields
                                    subcategories {
                                        ...CategoryFields
                                        subcategories {
                                            ...CategoryFields
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}