query OrderItemToGen($id: ID!) {
    orderItem(
        id: $id
    ) {
        id
        color {
            id
            hex
            label
        }
        product_size {
            height
            width
        }
        font {
            system_name
        }
        design {
            ...DesignItem
        }
        text_lines {
            id
            product_line_definition {
                id
            }
            value
        }
        product {
            line_definitions {
                id
                label
                max_length
                required
                default_value
                hidden
                sort
            }
        }
    }
}