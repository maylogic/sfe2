fragment CustomerData on User {
    id
    email
    name
}
fragment Pagination on PaginatorInfo {
    count
    currentPage
    firstItem
    hasMorePages
    lastItem
    lastPage
    perPage
    total
}
fragment Price on Price {
    regular
    is_discounted
    discounted
}
fragment TextLineDefinition on ProductLineDefinition {
    label
    max_length
    required
}
fragment GalleryItem on ProductGalleryItem {
    filename
    is_video
    label
    id
}
fragment TextArea on BaseTextArea {
    first_line
    height
    id
    inherit_color
    left
    lines
    text_color
    width
    top
    padding_y
}
fragment Customer on User {
    id
    email
    email_verified_at
    name
    role
}
fragment BaseFragment on Base {
    filename
    content
    id
    label
    text_areas {
        ...TextArea
    }
    base_preview {
        ...BasePreviewFragment
    }
}
fragment BasePreviewFragment on BasePreview {
    filename
    content
    id
    label
    text_areas {
        ...TextArea
    }
}
fragment DesignItem on Design {
    id
    preview
    label
    colors {
        id
        label
        hex
    }
    bases {
        ...BaseFragment
    }
    fonts {
        id
        name
        label
        filename_woff2
        updated_at
    }
}