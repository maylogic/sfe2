fragment CategoryFields on Category {
    id
    name
    slug
}
fragment CustomerData on Customer {
    id
    email
    first_name
    last_name
}
fragment CategoryProductFilters on ProductFilters {
    priceRange {
        min
        max
    }
    ratingRange {
        min
        max
    }
    attributes {
        code
        name
        label
        values
    }
}
fragment ProductMini on Product {
    id
    name
    slug
    price {
        isDiscounted
        regularPrice {
            amount
        }
        value {
            amount
        }
    }
    primaryImage {
        url
    }
    averageRating
    customAttributes {
        label
        name
        value
        values
        type
    }
}
fragment SidebarCartItem on CartItem {
    custom_attributes {
        label
        value
    }
    id
    image {
        url
    }
    quantity
    product {
        slug
        name
        sku
    }
    total_price {
        amount
    }
    unit_price {
        isDiscounted
        regularPrice {
            amount
        }
        value {
            amount
        }
    }
    quantity_limit
    quantity
}
fragment Totals on Cart {
    subtotalDiscountedPrice {
        amount
    }
    subtotalRegularPrice {
        amount
    }
    totalCouponDiscounts {
        amount
    }
    totalItems
    totalPrice {
        amount
    }
    totalShippingPrice {
        amount
    }
    totalTax {
        amount
    }
}
fragment SidebarCart on Cart {
    id
    items {
        ...SidebarCartItem
    }
    coupons {
        coupon {
            code
            name
        }
    }
    shippingMethod {
        name
        price {
            amount
        }
        estimatedDelivery
        description
    }
    ...Totals
}