fragment CustomerData on User {
    id
    email
    name
}
fragment ProductMini on Product {
    id
    name
    slug
    price {
        ...Price
    }
    primary_image {
        ...GalleryItem
    }
}
fragment Pagination on PaginatorInfo {
    count
    currentPage
    firstItem
    hasMorePages
    lastItem
    lastPage
    perPage
    total
}
fragment Price on Price {
    regular
    is_discounted
    discounted
}
fragment CartTextLine on CartItemTextLine {
    definition {
        ...TextLineDefinition
    }
    id
    value
}
fragment TextLineDefinition on ProductLineDefinition {
    label
    max_length
    required
}
fragment GalleryItem on ProductGalleryItem {
    filename
    is_video
    label
    id
}
fragment TextArea on BaseTextArea {
    first_line
    height
    id
    inherit_color
    left
    lines
    text_color
    width
    top
}
fragment SidebarCartItem on CartItem {
    id
    quantity
    product {
        slug
        name
        sku
        price {
            ...Price
        }
    }
    option_items {
        id
        label
        price {
            ...Price
        }
    }
    product_size {
        height
        id
        label
        price {
            ...Price
        }
        product_id
        thickness
        width
    }
    text_lines {
        ...CartTextLine
    }
    quantity
}
fragment Totals on Totals {
    subtotal
    grand_total {
        ...Price
    }
    points_used
}
fragment SidebarCart on Cart {
    id
    items {
        ...SidebarCartItem
    }
    coupons {
        code
        discount_percentage
    }
    shipping_method {
        name
        price {
            ...Price
        }
        estimated_delivery
        description
    }
    totals {
        ...Totals
    }
    apply_balance
    can_apply_balance
}