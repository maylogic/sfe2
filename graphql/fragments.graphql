fragment CustomerData on User {
    id
    email
    name
}
fragment ProductMini on Product {
    id
    name
    slug
    price {
        regular
        is_discounted
        discounted
    }
    gallery {
        filename
        is_video
    }
}
fragment SidebarCartItem on CartItem {
    id
    quantity
    product {
        slug
        name
        sku
        price {
            regular
            is_discounted
            discounted
        }
    }
    quantity
}
fragment Totals on Totals {
    subtotal
    grand_total {
        regular
        is_discounted
        discounted
    }
}
fragment SidebarCart on Cart {
    id
    items {
        ...SidebarCartItem
    }
    coupons {
        code
        discount_percentage
    }
    shipping_method {
        name
        price {
            regular
            is_discounted
            discounted
        }
        estimated_delivery
        description
    }
    totals {
        ...Totals
    }
}