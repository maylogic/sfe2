query ProductBySlug($slug: String!) {
    getProductBySlug(
        slug: $slug
    ) {
        key
        description
        name
        id
        slug
        sku
        sizes {
            id
            label
            price {
                ...Price
            }
            product_id
            thickness
            width
            height
        }
        reverse_side_base {
            ...BaseFragment
        }
        price {
            ...Price
        }
        options {
            id
            items {
                id
                label
                price {
                    ...Price
                }
            }
            required
            label
        }
        meta_title
        meta_description
        line_definitions {
            id
            label
            max_length
            required
            default_value
            hidden
            sort
        }
        gallery {
            ...GalleryItem
        }
        designs {
            id
            ...DesignItem
        }
    }
}