query ProductBySlug($slug: String!) {
    getProductBySlug(
        slug: $slug
    ) {
        key
        description
        name
        id
        slug
        sku
        sizes {
            id
            label
            price {
                ...Price
            }
            product_id
            thickness
            width
            height
        }
        reverse_side_base {
            filename
            id
            label
            text_areas {
                ...TextArea
            }
        }
        price {
            ...Price
        }
        options {
            id
            items {
                id
                label
                price {
                    ...Price
                }
            }
            label
        }
        meta_title
        meta_description
        line_definitions {
            label
            max_length
            required
        }
        gallery {
            ...GalleryItem
        }
        designs {
            bases {
                filename
                id
                label
                text_areas {
                    ...TextArea
                }
            }
        }
    }
}