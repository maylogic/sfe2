mutation RegisterCustomer($email: String!, $password: String!, $name: String!, $passwordConfirmation: String!) {
    registerCustomer(email: $email, password: $password, name: $name, password_confirmation: $passwordConfirmation) {
        ...CustomerData
    }
}

mutation LoginCustomer($email: String!, $password: String!) {
    loginCustomer(email: $email, password: $password) {
        ...CustomerData
    }
}