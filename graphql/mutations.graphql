mutation RegisterCustomer($email: String!, $password: String!, $firstName: String!, $lastName: String!, $passwordConfirmation: String!) {
    registerCustomer(email: $email, password: $password, first_name: $firstName, last_name: $lastName, password_confirmation: $passwordConfirmation) {
        id
        user {
            email
        }
    }
}

mutation LoginCustomer($email: String!, $password: String!) {
    loginCustomer(email: $email, password: $password)
}